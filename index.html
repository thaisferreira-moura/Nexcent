<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexcent</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="src/styles/styles.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            <img src="./src/assets/images/Logo.svg" alt="Logo Nexcent">
        </div>

        <nav class="navigation-header">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Service</a></li>
                <li><a href="#">Feature</a></li>
                <li><a href="#">Product</a></li>
                <li><a href="#">Testimonial</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>
        </nav>

        <div class="container-buttons">
            <a href="#" class="btn login">Login</a>
            <a href="#" class="btn sign-up">Sign Up</a>
        </div>

    </header>

    <!-- HERO -->
    <section class="hero-section">

        <div class="hero-main">

            <div class="hero-content">

                <h1>
                    Lessons and insights

                    <span>from 8 years</span>
                </h1>

                <p>
                    Where to grow your business as a photographer:
                    site or social media?
                </p>

                <a href="#" class="hero-button">
                    Register
                </a>

            </div>

            <div class="hero-image">
                <img src="./src/assets/images/Illustration.svg" alt="Hero image">
            </div>

        </div>

        <!-- DOTS -->
        <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

   
        <section class="clients">
        <h1>Our Clients</h1>
        <p>We have been working with some Fortune 500+ clients</p>

 <div class="clients-logos">        
        <img src="./src/assets/images/Logo(1).svg" alt="logo 1">
        <img src="./src/assets/images/Logo(2).svg" alt="logo 2">
        <img src="./src/assets/images/Logo(3).svg" alt="logo 3">
        <img src="./src/assets/images/Logo(4).svg" alt="logo 4">
        <img src="./src/assets/images/Logo(5).svg" alt="logo 5">
        <img src="./src/assets/images/Logo(6).svg" alt="logo 6">
        <img src="./src/assets/images/Logo(3).svg" alt="logo 7">
        
          </div>
</section>

    
</body>

</html>
